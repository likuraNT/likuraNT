<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320"
     viewBox="0 0 1200 320">
  <rect width="1200" height="320" fill="#101820"/>
  <!-- Pixel grid -->
  <defs>
    <pattern id="grid" width="24" height="24"
             patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none"
            stroke="#263843" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320"
        fill="url(#grid)" opacity=".5"/>
  <!-- Window -->
  <rect x="60" y="40" width="1080" height="240"
        fill="#1B2735" stroke="#7CFFB2"
        stroke-width="3"/>
  <rect x="60" y="40" width="1080" height="32"
        fill="#29433F"/>
  <!-- Window controls -->
  <rect x="78" y="51" width="10" height="10"
        fill="#FF7B72"/>
  <rect x="98" y="51" width="10" height="10"
        fill="#FFC857"/>
  <rect x="118" y="51" width="10" height="10"
        fill="#7CFFB2"/>
  <g font-family="monospace">
    <text x="160" y="61" font-size="14"
          fill="#E6EDF3">likuraOS / terminal</text>

    <text x="95" y="114" font-size="18"
          fill="#7CFFB2">
      guest@likura:~$ ./welcome
    </text>

    <text x="95" y="188" font-size="72"
          font-weight="bold"
          fill="#E6EDF3">likuraNT</text>

    <text x="98" y="226" font-size="19"
          fill="#FFC857">
      LEARNING • BUILDING • EXPLORING
    </text>

    <text x="98" y="254" font-size="13"
          fill="#72F1FF">
      [ SYSTEM ONLINE ]   VERSION 1.0
    </text>
  </g>
  <!-- Pixel decorations -->
  <g fill="#7CFFB2">
    <rect x="1010" y="117" width="16" height="16"/>
    <rect x="1010" y="133" width="16" height="16"/>
    <rect x="994" y="149" width="16" height="16"/>
    <rect x="1010" y="149" width="16" height="16"/>
    <rect x="1026" y="149" width="16" height="16"/>
    <rect x="1042" y="149" width="16" height="16"/>
    <rect x="1010" y="165" width="16" height="16"/>
  </g>
</svg>
